<!DOCTYPE html>
<html>
<head>
<!-- This is a single-page app: keep #/home, #/mentors, and other hash links
     inside the Apps Script iframe. `_top` sends those links to Google's outer
     userCodeAppPanel page and loses the in-memory signed-in profile. -->
<base target="_self">
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jomhuria&family=Valley+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
<style>
@import url('https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&display=swap');

:root{
  --ink:#23201B;
  --paper:#FBF7EF;
  --teal:#8CD3E4;
  --teal-dark:#258EA9;
  --gold:#B8863B;
  --rose:#A63D40;
  --sand:#F1EADA;
  --sand-dark:#E4D8BE;
  --line:#DDD3BE;
  --white:#FFFDF9;
  --radius-card: 14px;
  --radius-pill: 999px;
}
*{box-sizing:border-box;}
#app{font-family:'Libre Franklin',sans-serif;color:var(--ink);}
#app h1, #app h2, #app h3{font-family:'Valley Sans',sans-serif;}
#app{background:var(--paper);min-height:600px;padding-bottom:60px;}
#app a{text-decoration:none;}
#app button{cursor:pointer;font-family:inherit;}
#app input, #app select, #app textarea{
  font-family:inherit;font-size:14.5px;padding:10px 12px;border:1px solid var(--line);
  border-radius:8px;background:var(--white);width:100%;color:var(--ink);
}
#app input:focus, #app select:focus, #app textarea:focus{outline:2px solid var(--teal);outline-offset:1px;}
#app textarea{resize:vertical;min-height:90px;line-height:1.5;}
#app label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--teal-dark);}
.field{margin-bottom:16px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:640px){.field-row{grid-template-columns:1fr;}}

.btn{border:none;border-radius:var(--radius-pill);padding:10px 20px;font-weight:600;font-size:14px;transition:transform .12s ease, box-shadow .12s ease;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--teal);color:var(--white);}
.btn-primary:hover{background:var(--teal-dark);}
.btn-secondary{background:transparent;color:var(--teal);border:1.5px solid var(--teal);}
.btn-secondary:hover{background:var(--sand);}
.btn-gold{background:#FFE4AE;color:#7A4E14;}
.btn-gold:hover{background:#FFD98C;}
.btn-small{padding:6px 14px;font-size:12.5px;}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
.btn:disabled{opacity:.55;cursor:default;}

.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sand);border:1px solid var(--sand-dark);
  border-radius:var(--radius-pill);padding:5px 12px;font-size:12.5px;font-weight:500;margin:3px 4px 3px 0;}
.chip.tag-teal{background:rgba(140,211,228,.22);border-color:rgba(140,211,228,.6);color:var(--teal-dark);}
.chip.tag-rose{background:rgba(166,61,64,.09);border-color:rgba(166,61,64,.25);color:var(--rose);}
.chip.status-accepted{background:rgba(140,211,228,.28);color:var(--teal-dark);}
.chip.status-pending{background:rgba(184,134,59,.14);color:var(--gold);}
.chip.status-declined{background:rgba(0,0,0,.06);color:#8a8a8a;}

.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-card);padding:20px;}

/* ---------- Signup ---------- */
.auth-shell{max-width:640px;margin:0 auto;padding:56px 24px 40px;}
.auth-shell .brand-mark{font-size:24px;letter-spacing:.02em;color:var(--teal-dark);font-family:'Jomhuria',sans-serif;font-weight:600;margin-bottom:6px;}
.auth-shell h1{font-size:34px;font-weight:600;margin:0 0 8px;color:var(--teal-dark);}
.auth-shell p.lede{font-size:15.5px;color:#5b5548;margin:0 0 28px;line-height:1.55;}
.checkbox-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media(max-width:640px){.checkbox-grid{grid-template-columns:1fr;}}
.community-input-row{display:flex;gap:8px;}
.community-input-row input{flex:1;}
.community-chips{margin-top:10px;}
.community-chips .chip{display:inline-flex;align-items:center;gap:6px;}
.community-chips .chip-remove{background:none;border:none;font-size:15px;line-height:1;color:inherit;padding:0;opacity:.6;}
.community-chips .chip-remove:hover{opacity:1;}
.check-item{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--white);font-size:13.5px;}
.check-item input{width:auto;padding:0;accent-color:var(--teal);}
.section-title{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);margin:26px 0 10px;}
.error-msg{color:var(--rose);font-size:13px;margin-top:10px;}
.thankyou{text-align:center;padding:70px 20px;}
.thankyou .mark{width:56px;height:56px;border-radius:50%;background:var(--teal);color:var(--white);display:flex;
  align-items:center;justify-content:center;font-size:26px;margin:0 auto 22px;}

/* ---------- Nav ---------- */
.nav{background:var(--teal);position:sticky;top:0;z-index:30;}
.nav-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:22px;padding:13px 24px;}
.brand{color:var(--white);font-family:'Jomhuria',sans-serif;font-size:28px;font-weight:600;white-space:nowrap;letter-spacing:.02em;}
.brand span{color:var(--gold);}
.nav-search{position:relative;flex:1;max-width:360px;}
.nav-search input{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:var(--white);}
.nav-search input::placeholder{color:rgba(255,255,255,.65);}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--white);border:1px solid var(--line);
  border-radius:10px;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.14);max-height:320px;overflow-y:auto;}
.search-results a{display:block;padding:10px 14px;font-size:13.5px;border-bottom:1px solid var(--line);}
.search-results a:last-child{border-bottom:none;}
.search-results a:hover{background:var(--sand);}
.nav-links{display:flex;gap:6px;flex-shrink:0;}
.nav-links a{color:#FFFFFF;font-size:14px;font-weight:500;padding:8px 12px;border-radius:var(--radius-pill);position:relative;}
.nav-links a.active, .nav-links a:hover{background:#FFFFFF;color:#258EA9;}
.nav-links .badge{background:var(--rose);color:var(--white);font-size:10px;font-weight:700;padding:1px 6px;
  border-radius:10px;margin-left:5px;}
.nav-avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-weight:700;color:var(--white);font-size:13px;border:2px solid rgba(255,255,255,.4);}
@media(max-width:760px){
  .nav-inner{padding:12px 16px;gap:12px;flex-wrap:wrap;}
  .nav-search{order:3;flex-basis:100%;max-width:none;}
  .nav-links{gap:2px;overflow-x:auto;max-width:calc(100% - 130px);}
  .nav-links a{font-size:12.5px;padding:7px 9px;white-space:nowrap;}
  .page{padding:22px 16px 48px;}
}

.page{max-width:1180px;margin:0 auto;padding:28px 24px 60px;}
.page-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
.page-header h1{font-size:26px;font-weight:600;color:var(--teal-dark);margin:0;}
.muted{color:#7a7365;font-size:13.5px;}

/* ---------- Home layout ---------- */
.home-grid{display:grid;grid-template-columns:230px 1fr 260px;gap:22px;align-items:start;}
@media(max-width:980px){.home-grid{grid-template-columns:1fr;}}
.avatar-square{width:100%;aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:34px;font-weight:700;color:var(--white);margin-bottom:14px;}
.mini-profile h3{font-size:16.5px;margin:0 0 4px;}
.mini-profile p{font-size:13px;color:#5b5548;line-height:1.5;margin:0 0 12px;}

.toggle-row{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.toggle-btn{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-pill);padding:8px 16px;
  font-size:13px;font-weight:600;color:#5b5548;}
.toggle-btn.active{background:var(--teal);color:var(--white);border-color:var(--teal);}

.group-block{margin-bottom:26px;}
.group-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--teal-dark);
  border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px;}
.mentor-card{display:flex;gap:14px;padding:16px;border:1px solid var(--line);border-radius:var(--radius-card);
  background:var(--white);margin-bottom:12px;}
.mentor-avatar{width:52px;height:52px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-weight:700;color:var(--white);font-size:18px;}
.mentor-card .body{flex:1;min-width:0;}
.mentor-card h4{margin:0 0 3px;font-size:15.5px;}
.mentor-card h4 a{color:var(--ink);}
.mentor-card .meta{font-size:12px;color:#8a8370;margin-bottom:8px;}
.mentor-card .bio{font-size:13px;color:#5b5548;line-height:1.5;margin-bottom:10px;}
.service-actions{display:flex;flex-wrap:wrap;gap:8px;}
.service-actions .unit{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--radius-pill);
  padding:4px 6px 4px 12px;font-size:12px;background:#FEF5E3;}

.sidebar-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-card);padding:18px;margin-bottom:16px;}
.sidebar-card h3{font-size:14px;margin:0 0 12px;}
.stat-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:7px 0;border-bottom:1px solid var(--sand-dark);}
.stat-row:last-child{border-bottom:none;}
.stat-row .count{font-weight:700;color:var(--gold);}

.empty-state{border:1px dashed var(--line);border-radius:var(--radius-card);padding:30px;text-align:center;color:#8a8370;font-size:13.5px;}

/* ---------- Notifications ---------- */
.notif-item{display:flex;gap:14px;padding:16px;border:1px solid var(--line);border-radius:var(--radius-card);
  background:var(--white);margin-bottom:10px;align-items:flex-start;}
.notif-item .dot{width:9px;height:9px;border-radius:50%;background:var(--rose);margin-top:6px;flex-shrink:0;}
.notif-item.read .dot{background:var(--line);}
.notif-item .content{flex:1;}
.notif-item .time{font-size:11.5px;color:#a29a86;margin-top:4px;}
.notif-actions{display:flex;gap:8px;margin-top:10px;}

/* ---------- Profile page ---------- */
.profile-header{display:flex;gap:20px;align-items:center;margin-bottom:22px;flex-wrap:wrap;}
.profile-avatar-lg{width:88px;height:88px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-size:32px;font-weight:700;color:var(--white);flex-shrink:0;}
.profile-header h1{font-size:25px;margin:0 0 4px;}
.contact-locked{font-size:13px;color:#8a8370;font-style:italic;}
.section-block{margin-bottom:24px;}
.section-block h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--gold);margin:0 0 10px;font-weight:700;}
</style>

<div id="app"><div class="page"><p class="muted">Loading Footsteps…</p></div></div>

<script>
(function(){

const SERVICE_CATEGORIES = [
  "Academic Tutoring","Test Prep (SAT/ACT)","College Admissions Guidance","Career Mentorship",
  "Internship & Job Placement","Resume & Interview Help","Special Education Support","Religious Guidance",
  "Life Skills & General Advice","Financial Literacy","Coding & Tech Skills","Language Learning",
  "Arts, Music & Creative Skills","Sports & Fitness Coaching"
];
const FIELDS = [
  "Islamic Studies / Chaplaincy","Medicine & Health Sciences","Engineering & Technology","Business & Finance","Law",
  "Education","Psychology & Counseling","Arts & Design","Sciences","Trades & Vocational Skills",
  "K–12 Student","Undergraduate Student","Graduate Student","Other"
];
const PALETTE = ["#258EA9","#8CD3E4","#5DB8CF","#7AC9DB","#4EA2B9","#99DBE9"];

let currentProfile = null;

// ---------- storage helpers (Google Apps Script backend via google.script.run) ----------
function gsCall(fnName, ...args){
  return new Promise((resolve, reject)=>{
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)
      [fnName](...args);
  });
}
// Generic key-based shim so the rest of the app's logic (unchanged from the
// original) can keep calling sGet/sSet with 'profile:id' / 'conn:id' / 'notif:id'
// keys, dispatching to the matching Code.gs function under the hood.
async function sGet(key){
  if(key === 'my-profile-id') return null; // identity is handled by the email gate instead
  const i = key.indexOf(':'); const type = key.slice(0,i), id = key.slice(i+1);
  if(type === 'profile') return await gsCall('getProfile', id);
  if(type === 'conn') return await gsCall('getConns', id);
  if(type === 'notif') return await gsCall('getNotifs', id);
  return null;
}
async function sSet(key, value){
  if(key === 'my-profile-id') return true; // no-op, see above
  const i = key.indexOf(':'); const type = key.slice(0,i), id = key.slice(i+1);
  if(type === 'profile') return await gsCall('saveProfile', value);
  if(type === 'conn') return await gsCall('saveConns', id, value);
  if(type === 'notif') return await gsCall('saveNotifs', id, value);
  return null;
}
async function getAllProfiles(){
  return await gsCall('getAllProfiles');
}
async function getMyConns(){ return (await sGet('conn:'+currentProfile.id, true)) || []; }
async function getConnsFor(id){ return (await sGet('conn:'+id, true)) || []; }
async function getMyNotifs(){ return (await sGet('notif:'+currentProfile.id, true)) || []; }

function colorFor(str){
  let h=0; for(let i=0;i<str.length;i++) h = str.charCodeAt(i) + ((h<<5)-h);
  return PALETTE[Math.abs(h) % PALETTE.length];
}
function initials(name){
  return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]?.toUpperCase()||'').join('') || '?';
}
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
function avatarHTML(profile, size){
  const cls = size==='lg' ? 'profile-avatar-lg' : (size==='sq' ? 'avatar-square' : 'mentor-avatar');
  return `<div class="${cls}" style="background:${colorFor(profile.name||profile.id)}">${esc(initials(profile.name))}</div>`;
}

// ---------- connection helpers ----------
function findConn(conns, otherId, service){
  return conns.find(c => c.otherId===otherId && c.service===service);
}
async function sendConnectionRequest({mentorId, mentorName, menteeId, menteeName, service, requesterId}){
  const connId = 'c_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
  const now = Date.now();
  const mentorConn = {id:connId, otherId:menteeId, otherName:menteeName, service, iAmMentor:true, status:'pending',
    direction: requesterId===mentorId?'sent':'received', createdAt:now};
  const menteeConn = {id:connId, otherId:mentorId, otherName:mentorName, service, iAmMentor:false, status:'pending',
    direction: requesterId===menteeId?'sent':'received', createdAt:now};
  const mentorConns = await getConnsFor(mentorId);
  const menteeConns = await getConnsFor(menteeId);
  mentorConns.push(mentorConn);
  menteeConns.push(menteeConn);
  await sSet('conn:'+mentorId, mentorConns, true);
  await sSet('conn:'+menteeId, menteeConns, true);
  const receiverId = requesterId===mentorId ? menteeId : mentorId;
  const requesterName = requesterId===mentorId ? mentorName : menteeName;
  const notifs = (await sGet('notif:'+receiverId, true)) || [];
  notifs.unshift({id:'n_'+now, type:'request', connId, service, read:false, createdAt:now,
    text: `${requesterName} would like to connect with you for "${service}".`});
  await sSet('notif:'+receiverId, notifs, true);
}
async function respondToConnection(connId, accept){
  const myConns = await getMyConns();
  const mine = myConns.find(c=>c.id===connId);
  if(!mine) return;
  const otherConns = await getConnsFor(mine.otherId);
  const theirs = otherConns.find(c=>c.id===connId);
  mine.status = accept ? 'accepted' : 'declined';
  if(theirs) theirs.status = accept ? 'accepted' : 'declined';
  await sSet('conn:'+currentProfile.id, myConns, true);
  await sSet('conn:'+mine.otherId, otherConns, true);

  const myNotifs = await getMyNotifs();
  const n = myNotifs.find(n=>n.connId===connId);
  if(n) n.read = true;
  await sSet('notif:'+currentProfile.id, myNotifs, true);

  if(accept){
    const otherNotifs = (await sGet('notif:'+mine.otherId, true)) || [];
    otherNotifs.unshift({id:'n_'+Date.now(), type:'accepted', connId, read:false, createdAt:Date.now(),
      text: `${currentProfile.name} accepted your request for "${mine.service}". You can now see each other's contact info on your profiles.`});
    await sSet('notif:'+mine.otherId, otherNotifs, true);
  }
}
function matchedServices(needsList, offersList){
  return (offersList||[]).filter(s => (needsList||[]).includes(s));
}

// ---------- router ----------
function getHash(){
  const h = location.hash.replace(/^#\/?/, '');
  return h || '';
}
window.addEventListener('hashchange', ()=>{ if(currentProfile) render(); });
window.addEventListener('load', init);

// Apps Script has no built-in "which browser session is this" hook that works
// reliably across account types, so identity here is a simple email lookup:
// enter your email, we check for a matching profile, and if none exists you're
// sent to sign up. There's no persistence across a page refresh — you'll need
// to re-enter your email each time you reload, which is fine for tinkering but
// worth hardening (e.g. a query-string token) before a real deployment.
let prefillEmail = '';
async function init(){
  document.getElementById('app').innerHTML = gateHTML();
  document.getElementById('gateContinue').addEventListener('click', onGateContinue);
  document.getElementById('gateEmail').addEventListener('keydown', (e)=>{ if(e.key==='Enter') onGateContinue(); });
}
function gateHTML(){
  return `
  <div class="auth-shell">
    <div class="brand-mark">Footsteps</div>
    <h1>Welcome — let's find your profile.</h1>
    <p class="lede">Enter your email. If you've signed up before we'll load your profile; if not, we'll take you to create one.</p>
    <div class="field"><label>Email</label><input id="gateEmail" type="email" placeholder="you@example.com" /></div>
    <button id="gateContinue" class="btn btn-primary">Continue</button>
  </div>`;
}
async function onGateContinue(){
  const email = document.getElementById('gateEmail').value.trim();
  if(!email) return;
  const btn = document.getElementById('gateContinue');
  btn.disabled = true; btn.textContent = 'Checking…';
  try {
    const found = await gsCall('findProfileByEmail', email);
    const destination = found ? 'home' : 'signup';
    const wasAlreadyThere = getHash() === destination;
    if(found){
      currentProfile = found;
    } else {
      prefillEmail = email;
      currentProfile = null;
    }
    location.hash = '#/' + destination;
    // If the route is already selected, changing the hash will not emit a
    // hashchange event; render in that one case only.
    if(wasAlreadyThere) await render();
  } catch (error) {
    btn.disabled = false;
    btn.textContent = 'Continue';
    const message = error && error.message ? error.message : 'Unable to load profiles. Please try again.';
    document.querySelector('.auth-shell').insertAdjacentHTML('beforeend', `<p class="error-msg">${esc(message)}</p>`);
  }
}

async function render(){
  const app = document.getElementById('app');
  let hash = getHash();
  if(!currentProfile && hash !== 'signup'){ init(); return; }
  if(currentProfile && hash === 'signup'){ location.hash = '#/home'; render(); return; }
  const parts = hash.split('/');
  const route = parts[0] || 'signup';
  const param = parts[1];

  if(route === 'signup'){ app.innerHTML = signupHTML(); wireSignup(); return; }

  // all other routes share the nav shell
  app.innerHTML = shellHTML(route) + `<div id="pageBody" class="page"><p class="muted">Loading…</p></div>`;
  await wireNav(route);

  if(route === 'home') await renderHome();
  else if(route === 'mentors') await renderMentors();
  else if(route === 'mentees') await renderMentees();
  else if(route === 'notifications') await renderNotifications();
  else if(route === 'profile') await renderProfile(param);
  else document.getElementById('pageBody').innerHTML = `<div class="empty-state">Page not found.</div>`;
}

// ================= SIGNUP =================
function serviceChecks(name){
  return SERVICE_CATEGORIES.map(s=>`
    <label class="check-item"><input type="checkbox" name="${name}" value="${esc(s)}"> ${esc(s)}</label>
  `).join('');
}
function communityFieldHTML(){
  return `
  <div class="field">
    <label>Communities you're part of</label>
    <div class="community-input-row">
      <input type="text" id="communityInput" placeholder="e.g. Bergen Masjid, Lincoln High School" />
      <button type="button" id="addCommunityBtn" class="btn btn-secondary btn-small">Add</button>
    </div>
    <div class="community-chips" id="communityChips"></div>
    <input type="hidden" name="communities" id="communitiesHidden" value="[]">
  </div>`;
}
// Shared by the signup form and the edit-profile form. Keeps a plain JS array
// in memory as chips are added/removed, and mirrors it into a hidden input
// so it rides along with the rest of the form on submit.
function wireCommunityInput(initial){
  let communities = initial ? [...initial] : [];
  const chipsEl = document.getElementById('communityChips');
  const hiddenEl = document.getElementById('communitiesHidden');
  function renderChips(){
    hiddenEl.value = JSON.stringify(communities);
    chipsEl.innerHTML = communities.map((c,i)=>
      `<span class="chip tag-teal">${esc(c)} <button type="button" class="chip-remove" data-i="${i}">&times;</button></span>`
    ).join('');
    chipsEl.querySelectorAll('.chip-remove').forEach(btn=>{
      btn.addEventListener('click', ()=>{ communities.splice(+btn.dataset.i, 1); renderChips(); });
    });
  }
  function addFromInput(){
    const input = document.getElementById('communityInput');
    const val = input.value.trim();
    if(val && !communities.some(c=>c.toLowerCase()===val.toLowerCase())){
      communities.push(val); input.value=''; renderChips();
    }
  }
  document.getElementById('addCommunityBtn').addEventListener('click', addFromInput);
  document.getElementById('communityInput').addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){ e.preventDefault(); addFromInput(); }
  });
  renderChips();
}

function wireSignup(){
  const form = document.getElementById('signupForm');
  wireCommunityInput([]);
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(form);
    const offered = fd.getAll('offered');
    const needed = fd.getAll('needed');
    let communities = [];
    try{ communities = JSON.parse(fd.get('communities') || '[]'); }catch(e){ communities = []; }
    const errEl = document.getElementById('signupError');
    if(offered.length===0 && needed.length===0){
      errEl.textContent = 'Please select at least one service you can offer or one you need.';
      errEl.style.display='block';
      return;
    }
    const id = 'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    const profile = {
      id, name: fd.get('name').trim(), age: fd.get('age'), email: fd.get('email').trim(),
      phone: fd.get('phone').trim(), field: fd.get('field'), locality: fd.get('locality').trim(),
      bio: (fd.get('bio')||'').trim(), communities, servicesOffered: offered, servicesNeeded: needed, createdAt: Date.now()
    };
    await sSet('profile:'+id, profile, true);
    await sSet('my-profile-id', id, false);
    await sSet('conn:'+id, [], true);
    await sSet('notif:'+id, [], true);
    currentProfile = profile;
    document.getElementById('app').innerHTML = thankYouHTML(profile);
    document.getElementById('continueBtn').addEventListener('click', ()=>{ location.hash = '#/home'; });
  });
}
function thankYouHTML(profile){
  let msg = '';
  if(profile.servicesOffered.length) msg += `<p>As soon as we find someone in need of what you offer, you'll be matched with them as a mentor.</p>`;
  if(profile.servicesNeeded.length) msg += `<p>As soon as we find someone who can offer what you need, you'll be matched with them as a mentee.</p>`;
  return `
  <div class="auth-shell thankyou">
    <div class="mark">✓</div>
    <h1>Thank you for signing up!</h1>
    ${msg}
    <button id="continueBtn" class="btn btn-primary" style="margin-top:18px;">Continue to your home page</button>
  </div>`;
}

async function wireNav(){
  const notifs = await getMyNotifs();
  const unread = notifs.filter(n=>!n.read).length;
  const badge = document.getElementById('notifBadge');
  if(unread>0){ badge.style.display='inline'; badge.textContent = unread; }

  const input = document.getElementById('searchInput');
  const results = document.getElementById('searchResults');
  input.addEventListener('input', async ()=>{
    const q = input.value.trim().toLowerCase();
    if(!q){ results.style.display='none'; results.innerHTML=''; return; }
    const all = await getAllProfiles();
    const matches = all.filter(p => p.id!==currentProfile.id && (
      p.name.toLowerCase().includes(q) ||
      (p.field||'').toLowerCase().includes(q) ||
      (p.locality||'').toLowerCase().includes(q) ||
      (p.servicesOffered||[]).some(s=>s.toLowerCase().includes(q)) ||
      (p.servicesNeeded||[]).some(s=>s.toLowerCase().includes(q)) ||
      (p.communities||[]).some(c=>c.toLowerCase().includes(q))
    )).slice(0,8);
    if(matches.length===0){ results.innerHTML = `<a style="color:#8a8370;">No matches found.</a>`; }
    else{
      results.innerHTML = matches.map(p=>{
        // Prefer showing the community that actually matched, so a search like
        // "Bergen Masjid" surfaces *why* someone showed up, not just their field.
        const matchedCommunity = (p.communities||[]).find(c=>c.toLowerCase().includes(q));
        const subtitle = matchedCommunity || p.field || '';
        return `<a href="#/profile/${p.id}">${esc(p.name)} — <span style="color:#8a8370;">${esc(subtitle)}</span></a>`;
      }).join('');
    }
    results.style.display='block';
  });
  document.addEventListener('click', (e)=>{
    if(!results.contains(e.target) && e.target!==input) results.style.display='none';
  });
}

function feedHTML(others){
  if(others.length===0) return `<div class="empty-state">No mentors have joined yet in your community. Check back soon, or invite someone!</div>`;
  let groups = new Map();
  if(homeMode==='service'){
    const myNeeds = currentProfile.servicesNeeded||[];
    const cats = [...SERVICE_CATEGORIES].sort((a,b)=>{
      const am = myNeeds.includes(a)?0:1, bm = myNeeds.includes(b)?0:1;
      return am-bm || a.localeCompare(b);
    });
    cats.forEach(cat=>{
      const list = others.filter(p=>(p.servicesOffered||[]).includes(cat));
      if(list.length) groups.set(cat, list);
    });
  } else if(homeMode==='locality'){
    const byLoc = {};
    others.forEach(p=>{ const k=p.locality||'Unspecified'; (byLoc[k]=byLoc[k]||[]).push(p); });
    const keys = Object.keys(byLoc).sort((a,b)=>{
      const am = a===currentProfile.locality?0:1, bm = b===currentProfile.locality?0:1;
      return am-bm || a.localeCompare(b);
    });
    keys.forEach(k=>groups.set(k, byLoc[k]));
  } else {
    const byField = {};
    others.forEach(p=>{ const k=p.field||'Other'; (byField[k]=byField[k]||[]).push(p); });
    const keys = Object.keys(byField).sort((a,b)=>{
      const am = a===currentProfile.field?0:1, bm = b===currentProfile.field?0:1;
      return am-bm || a.localeCompare(b);
    });
    keys.forEach(k=>groups.set(k, byField[k]));
  }
  let html = '';
  for(const [title, list] of groups){
    html += `<div class="group-block"><div class="group-title">${esc(title)}</div>${list.map(p=>mentorCardHTML(p)).join('')}</div>`;
  }
  return html || `<div class="empty-state">Nothing to show yet.</div>`;
}

    ${avatarHTML(p)}
    <div class="body">
      <h4><a href="#/profile/${p.id}">${esc(p.name)}</a></h4>

      // individual button, rather than relying on the optional page argument.

      btn.textContent='Sent ✓';

async function renderNotifications(){
  const body = document.getElementById('pageBody');
  const notifs = await getMyNotifs();
  const sorted = [...notifs].sort((a,b)=>b.createdAt-a.createdAt);
  body.innerHTML = `
    <div class="page-header"><h1>Notifications</h1></div>
    <div>
      ${sorted.length ? sorted.map(n=>notifHTML(n)).join('') : `<div class="empty-state">No notifications yet. Nothing to see here for now.</div>`}
    </div>`;
  // mark request-type as read once viewed (except still needing response, keep unread styling logic simple: only mark pure-info ones)
  document.querySelectorAll('.notif-accept').forEach(btn=>{
    btn.addEventListener('click', async ()=>{ await respondToConnection(btn.dataset.conn, true); renderNotifications(); wireNav(); });
  });
  document.querySelectorAll('.notif-decline').forEach(btn=>{
    btn.addEventListener('click', async ()=>{ await respondToConnection(btn.dataset.conn, false); renderNotifications(); wireNav(); });
  });
  const unresolvedNone = sorted.filter(n=>n.type!=='request');
  if(unresolvedNone.length){
    const updated = notifs.map(n => n.type!=='request' ? {...n, read:true} : n);
    await sSet('notif:'+currentProfile.id, updated, true);
  }
}

    <label class="check-item"><input type="checkbox" name="${name}" value="${esc(s)}" ${arr.includes(s)?'checked':''}> ${esc(s)}</label>`).join('');
  body.innerHTML = `
    <div class="card">
      <h1 style="font-size:22px;margin-bottom:18px;">Edit profile information</h1>
      <form id="editForm">
        <div class="field-row">
          <div class="field"><label>Full name</label><input required name="name" value="${esc(profile.name)}"/></div>
          <div class="field"><label>Age</label><input required name="age" type="number" value="${esc(String(profile.age))}"/></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Email</label><input required name="email" type="email" value="${esc(profile.email)}"/></div>
          <div class="field"><label>Phone number</label><input required name="phone" value="${esc(profile.phone)}"/></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Field of study / expertise</label><select required name="field">${fieldOpts}</select></div>
          <div class="field"><label>Locality</label><input required name="locality" value="${esc(profile.locality)}"/></div>
        </div>
        <div class="field"><label>Bio</label><textarea name="bio">${esc(profile.bio||'')}</textarea></div>
        ${communityFieldHTML()}
        <div class="section-title">Services you're willing to provide</div>
        <div class="checkbox-grid">${svcCheck('offered', profile.servicesOffered||[])}</div>
        <div class="section-title">Services you're in need of</div>
        <div class="checkbox-grid">${svcCheck('needed', profile.servicesNeeded||[])}</div>
        <div id="editError" class="error-msg" style="display:none;"></div>
        <div style="margin-top:22px;display:flex;gap:10px;">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" id="cancelEdit" class="btn btn-ghost">Cancel</button>
        </div>
      </form>
    </div>`;
  document.getElementById('cancelEdit').addEventListener('click', ()=>renderProfile());
  wireCommunityInput(profile.communities||[]);
  document.getElementById('editForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const offered = fd.getAll('offered'); const needed = fd.getAll('needed');
    let communities = [];
    try{ communities = JSON.parse(fd.get('communities') || '[]'); }catch(e){ communities = []; }
    if(offered.length===0 && needed.length===0){
      const err = document.getElementById('editError');
      err.textContent = 'Please keep at least one service offered or needed.'; err.style.display='block'; return;
    }
    const updated = {...profile, name:fd.get('name').trim(), age:fd.get('age'), email:fd.get('email').trim(),
      phone:fd.get('phone').trim(), field:fd.get('field'), locality:fd.get('locality').trim(),
      bio:(fd.get('bio')||'').trim(), communities, servicesOffered:offered, servicesNeeded:needed};
    await sSet('profile:'+profile.id, updated, true);
    currentProfile = updated;
    renderProfile();
  });
}

})();
</script>

</body>
</html>
